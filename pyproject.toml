[project]
name = "youtube-galaxy-mlops"
version = "0.2.0"
description = "Local MLOps pipeline for the YouTube Galaxy map (static site + Cloudflare Worker chat)"
requires-python = ">=3.11,<3.12"
dependencies = []

# Not a distributable package: modules run in place with `uv run --group pipeline python -m pipeline.<step>`.
# Airflow is deliberately NOT here. It lives in its own venv (.venv-airflow, see scripts/setup_airflow.sh)
# because its pins conflict with the ML stack. DAG tasks shell out to this environment.
[tool.uv]
package = false
default-groups = ["pipeline", "dev"]

[dependency-groups]
pipeline = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.6",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "mlflow>=2.14",
    "paramiko>=3.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["archive"]
