# Each entry: question (as a visitor would type it), expected (creator titles or fandom_ ids that
# a good answer should include in its top 8), notes, status.
# status: draft    = proposed by Claude from general knowledge of the genre; NOT ground truth.
#         approved = reviewed by the owner; only these count toward the gate's recall check.
# Expected lists were written before looking at search results, so the eval is not circular.
# To approve: fix the expected list if needed, then change `draft` to `approved`.

