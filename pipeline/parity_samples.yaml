- id: fandom_500338
  url: https://youtube.fandom.com/wiki/ChequerChequer
  text: 'ChequerChequer - ChequerChequer is a Brazilian YouTuber who does covers of video game music. The first cover ChequerChequer released was the Scars of Time from Chrono Cross, which released on August 20, 2011. The next cover was the Firefly Light (Hotaru no Hikari) from the Naruto series, which released on September 16. Two weeks later, a cover of the Lost Painting from Castlevania: Symphony of the Night. On October 11, a cover of Silence Before the Storm from Final Fantasy X was released. On October 19, Fighting Spirit from Tales of Phantasia was released. The first medley by ChequerChequer contained various themes from the Castlevania series, which ran for seven minutes, and was released on November 1. On November 27, a cover of Dragon Roost Island from The Legend of Zelda: The Wind Waker was released. On December 5, the opening theme of Sunset Riders was covered. After six months of inactivity, ChequerChequer came back with a cover in 2012 about the Dr. Wily stages 1 & 2 theme
    from Mega Man 2. Next in line came the Showdown with Magnus from Chrono Trigger, which released on July 13. On August 22, a seven-and-a-half minute medley with themes from Final Fantasy VI was released. On September 2, a cover of the Opening Stage from Mega Man 7 was released. On November 2, a cover of the Haunted Graveyard from Ghosts ''n Goblins was released. The first cover of 2013 was the Plug Man stage from Mega Man 9, which released on January 12. On February 18, a nine-minute medley with themes from Donkey Kong Country 2: Diddy''s Kong-Quest was released, which turned out to be a worldwide breakthrough. On March 20, a cover of Gerudo Valley from The Legend of Zelda: Ocarina of Time was released. On April 5, a cover of the Metal Harbor from Sonic Adventure 2 was released. On June 20, the Alleycat Blues from Teenage Mutant Ninja Turtles IV: Turtles in Time was covered, which featured Estevan Martins as an additional guitarist, marking the first time ChequerChequer collaborated with
    another user. On July 6'
- id: fandom_557475
  url: https://youtube.fandom.com/wiki/PaperPlane
  text: 'PaperPlane - PaperPlane, also known online as PaperPlaneTF, is a British YouTuber who uploads animations, book reading, commentary, educational, gaming, film, meme, reviews, reactions, and vlogs videos. He gained popularity through his videos regarding the Transformers series. PaperPlane created his channel on August 13, 2010. On July 18, 2015, he uploaded his first video titled " Every Transformers toy review ever". On January 30, 2016, he uploaded the most viewed video of the channel titled "Every transformation from The Transformers". On 2019, he uploaded their first community post. On July 25, 2022, he uploaded the video trailer of the channel titled "Transformers The Movie''s Soundtrack: Hidden Meanings and Leitmotifs". On September 26, 2022, he uploaded the first and most viewed short of the channel titled "better call prime".'
- id: fandom_564561
  url: https://youtube.fandom.com/wiki/LEX3X
  text: 'LEX3X - LEX3X, (born: 2007 [age 17–18]) also known as kiwiquest is an American Artist, Musician, Game developer and Former YouTuber. She mainly made gaming videos showcasing Friday Night Funkin mods. She is mainly known for popularizing the FNAF Bear5 meme by making a mod about it in 2023. Lex created her channel on December 8, 2020. She made her first video titled "How to get rich QUICK!" on May 8, 2021. Her most popular video was made titled "Cycles - Friday Night Funkin'' Dsides Remix (ft. Rareblin) (Official Upload)" on October 31, 2022. On January 7, 2025, Lex announced that she would be taking a hiatus from the internet and will fully stop developing FNF Mods and music. She stated that most people who played her FNF mods harrassed her over her artstyle, they were racist to her and sexualized her when she just 15 years old. The following are the Friday Night Funkin mods they developed: She is Trans. Note: The following dates are according to Social Blade. Dates may vary by
    one or two days due to differences in time zones.'
- id: fandom_421805
  url: https://youtube.fandom.com/wiki/Arisu
  text: Arisu - Alice, better known online as Arisu is a Canadian gaming YouTuber who plays ROBLOX, and more specifically, Adopt Me!. She is currently residing in Canada and joined YouTube on December 17, 2018. As of October 2021, she has accumulated 623,000 subscribers and a total of 53 million views. She uploads a wide variety of content revolved around decorating and speed building houses among other buildings in the Roblox game Adopt Me. She can design/decorate houses, treehouses, smaller homes, luxury apartments, and more. As of now, she is currently on hiatus via her personal Instagram bio.
- id: fandom_522162
  url: https://youtube.fandom.com/wiki/KoolandthegangShow
  text: KoolandthegangShow - KoolandthegangShow is the YouTube channel for the American band Kool and the Gang. Kool and the Gang was founded in 1964 by Robert ''Kool'' Bell and his brother Ronald Bell. The bands name officially became Kool and the Gang in 1969. The band has released many albums through their career including, Kool and the Gang,Music Is the Message,Good Times,Wild and Peaceful, Light of Worlds,Spirit of the Boogie, Love & Understanding, Open Sesame, The Force, Everybody's Dancin', Ladies' Night, Celebrate, Something Special, As One,In the Heart,Emergency,Forever, Sweat, Unite, State of Affairs, Gangland, Still Kool, Kool for the Holidays,Perfect Union and People Just Wanna Have Fun. Kool and the Gang joined YouTube on April 25 2012.
- id: fandom_485082
  url: https://youtube.fandom.com/wiki/Rin_Penrose_Ch._idol-EN
  text: 'Rin Penrose Ch. idol-EN - Rin Penrose (birthday: February 4)[citation needed] is a VTuber formerly affiliated with the agency idol. She was part of the agency''s second wave, alongside four other VTubers, Fuyo Cloverfield, Yuko Yurei, Juna Unagi and Pochi Wanmaru.[citation needed] As of November 15 2024, she has become an independent Vtuber. Her debut was streamed live on November 20, 2022. Prior to it, she had uploaded a number of shorts. Post-debut, she released her first original song, Golden Age. She has streamed herself playing Untitled Goose Game, Animal Crossing: New Horizons, Minecraft, Potion Craft, Wii Sports, Cult of the Lamb, Portal, Pokemon Violet, TABS: Totally Accurate Battle Simulator, One Hand Clapping, The Stanley Parable: Ultra Deluxe, Turnip Boy Commits Tax Evasion and Sonic Frontiers amongst other games. Rin also streams karaoke, drawing, Amiibo unboxing and chatting streams. For April Fool''s Day 2023, Rin streamed an Old Outfit reveal. Bettel and Altare are
    aware of Rin and once mocked her accent when they noticed her in their chat. Her character designer is 巻羊. She shares her character designer with Shiki Miyoshino. She is 155cm tall. Her character rigger is reinly. Her logo and overlays were made by CiaraChii. Rin is the self-proclaimed prince (“Not princess!”) of a kingdom in another world. Though she tries to maintain a “proper” demeanour befitting her royal heritage, her true, unfathomable personality always shines through. As for why a prince would want to be a VTuber… It seems even the Royal Family has its secrets.[citation needed] Her fans are known as Princedom. Channel members gain access to exclusive streams such as her revealing specific IKEA plushies she has and her completed jigsaw puzzles. Rin was born with Meningitis. She also has a number of other medical issues such as weak lungs, and also had jaundice in the past. She has an adopted brother. She also mentions having sisters, who are also adopted. Her parents are divorced.
    On August 8th, 2023, she came '
- id: fandom_388378
  url: https://youtube.fandom.com/wiki/Gamer_Chance
  text: 'Gamer Chance - Chance Durette, better known online as Gamer Chance, is an American YouTuber known for his animation videos. He makes short animations consisting of a character with a cyan shirt and stick arms and legs doing random things. He also makes BFB fan-animations and YTP''s. His most notable animation is a ten minute movie called Escaping Jail. His most notable content is his 2 shows, The Piggy Toy Show! And Quest To Stop Evil chance. He also occasionally does short, animated skits, and gaming videos usually involving Roblox, and FNAF and also his battle for shadow demon which is on its 2nd season. Gamer Chance''s early videos are mainly videos of him reading, playing Roblox and Talking Tom, watching TV and doing random Angry Birds skits called Angry Birds Epic. The rest of his older videos are mainly just plush videos and toy videos with some Roblox here and there. Soon, Chance started doing reaction and gameplay videos. The videos that he reacted to were FNaF songs, Baldi
    animations and other animations. The games that he played were Dumb ways to Die, Roblox and .IO games. It wasn''t until December 22, 2019 when he uploaded his first animation. Fly and Fall was the first animation that Gamer Chance uploaded. It involves a colorless version of his character flying and then falling to the ground. It ends with an explosion once he hits the ground. One of his first animation series was "Try not to laugh: Funny animations" Which involved a compilation of random skits. He has stopped doing this, though. On September 23, 2020 Chance posted the original trailer for Escaping Jail, the plot centered around Chance and his best friend "Dave" escape from jail after being framed by "Gunner" while meeting up with his friends and getting past cops and his evil form. This would later lead to Revenge Of Gunner and "Escaping Jail - The Game" Revenge Of Gunner is the Sequel to Escaping Jail, featuring Chance, Dave, Modern Sonic, Classic Sonic, Henry, And a mystery character
    later revealed to b'
- id: fandom_211306
  url: https://youtube.fandom.com/wiki/BANGTANTV
  text: 'BANGTANTV - BANGTANTV is a South Korean YouTube channel owned by the South Korean boy band BTS, also known as Bangtan Boys. The band was formed in Seoul in 2013 consisting of members: Jin (born: December 4, 1992 (1992-12-04) [age 33]), Suga (also known as Agust D; born: March 9, 1993 (1993-03-09) [age 32]), J-Hope (born February 18, 1994 (1994-02-18) [age 31]), RM (formerly Rap Monster; born: September 12, 1994 (1994-09-12) [age 31]), Jimin (born: October 13, 1995 (1995-10-13) [age 30]), V (born: December 30, 1995 (1995-12-30) [age 29]) and Jungkook (born: September 1, 1997 (1997-09-01) [age 28]). The septet co-writes and produces much of their output. BTS serves as a seven-member Korean pop group who debuted in 2013 under Big Hit Entertainment, which was at the time a small, underdog label that has since become a Korean entertainment powerhouse. The group''s Korean name, 방탄소년단, Bangtan Sonyeondan, translates into English as "Bulletproof Boy Scouts," and was borne out of CEO Bang
    Si-Hyuk''s desire to create a group that could withstand social pressures and serve as a voice for the younger generation. The group''s first single, "No More Dream," is an aggressive, hip-hop track that calls out young people without dreams of their own, challenging societal academic expectations for Korean youth in the process. Since their debut, BTS has found success both in South Korea and eventually worldwide, cementing their current status as the world''s biggest boy band. After cinching a Korean music show win (a crucial marker of success for K-pop artists) in 2015 with breakout single "I Need U," the group went on to win Album of the Year (a daesang, one of the top awards) at the 2016 Melon Music Awards for The Most Beautiful Moment In Life: Young Forever. Since then, the group has picked up subsequent awards like Top Duo/Group at the BBMAs in 2019; its members were the youngest recipients of South Korea''s Order of Cultural Merit in 2018. BTS broke into the American market in
    earnest in 2017, winni'
- id: fandom_476688
  url: https://youtube.fandom.com/wiki/GRUFF
  text: 'GRUFF - GRUFF (born: May 14, 2001 (2001-05-14) [age 24]), formerly known as BONES, is a Canadian YouTuber known for his commentary and gaming videos. He is also an aspiring singer-songwriter. He has garnered attention online for his distinct voice. He primarily uploads gameplay videos, most specifically relating to Minecraft content within his SMP (Survival Multiplayer) server, where he is accompanied by several of his close friends. He is most notoriously known for his video "I Faked My Voice for 9 Years". GRUFF was born and raised in Toronto, Canada on May 14th, 2001. He graduated from High School in 2019 and is currently enrolled in Post-Secondary studies whilst creating content on YouTube. Alongside this, he also practices guitar, as well as song writing, as he aspires to create music. He identifies with pansexuality, but prefers to be more casual about this part of his identity and refrains from talking about it often. He is fairly open about his experiences with suffering
    from a functional voice disorder known as "Puberphonia", also referred to as "Mutational Falsetto", affecting the pitch of his voice. He refers to it as the habitual usage of a high-pitched voice after puberty, caused by strain via the cricothyroid muscle. His high-pitched speaking register is what he calls his "fake voice", which sits at approximately 220hz, in comparison to his real voice, which sits at approximately 100-104hz. He is often misgendered due to his disorder. He talks openly about how this experience has caused him to have complications revolving around his gender identity growing up, and identifies the issue beginning at the time of puberty, when he felt isolated from his male peers as he was socialized around feminine influences. Likewise, he has stated that he is not certain about the status of whether he has been diagnosed, but recognizes that his Speech Language Pathologist (SLP) has identified and referred to his issues via its respective clinical term(s). As of
    September 6th, 20'
- id: fandom_507799
  url: https://youtube.fandom.com/wiki/ZSpace
  text: ZSpace - zSpace is an American technology firm founded in 2007. zSpace was originally founded as Infinite Z in 2007. Infinite Z's virtual-holographic platform was created with backing from the Central Intelligence Agency's In-Q-Tel fund, which invests in technology startups. Infinite Z formally changed its name to zSpace in 2013. In 2014, zSpace collaborated with NASA to be tested as an interface technology for future robots, using the program to interact with simulated objects in virtual environments using imaging displays. In 2012, zSpace released an independent software development kit. At ISTE 2018, zSpace released its first Windows 10 laptop for schools. In 2022, zSpace announced a merger with EdtechX Holdings Acquisition Corporation II, an educational tech-focused SPAC. As a result of the merger, the combined company is expected to be named zSpace Technologies, Inc. and listed on the Nasdaq Stock Market under the new ticker symbol ZSPX. The channel was created on June 20, 2013,
    and the first video was uploaded on July 25, 2013. The channel uploads educational videos and overviews of their work.
- id: fandom_473163
  url: https://youtube.fandom.com/wiki/BobbyBroccoli
  text: 'BobbyBroccoli - Kevan MacKay (born: October 30, 1996 (1996-10-30) [age 29]), better known online as BobbyBroccoli, is a Canadian YouTuber, animator, and filmmaker who makes educational videos on scientific controversies. MacKay studied engineering physics and photonics in school. In September 2021, he graduated with a Master''s of Applied Science in Electrical Engineering. He does sports, particularly recreational softball. In the eight grade, MacKay started a comic named BobbyBroccoli, named for the main character. He has an inactive Facebook account which he posts artworks, mostly the vegetable broccoli. MacKay’s early content focused on film and video game reviews. Some of these used the title “Broccoli Reviews,” which ended with his 2020 April Fool’s video. MacKay was a former cartoonist, he used to draw comics digitally. He formerly animated in Google Earth, but switched to Blender in March 2021. His reasons for switching were the fact that “Google Earth for desktop could go
    defunct at any time,” it is not an animation suite, and has less functionality and control. The music that he uses for credits was his second choice. He could not use his first choice due to copyright issues, despite having permission from the singer. Around November 2022, MacKay became affiliated with Nebula, a streaming service that distributes his YouTube videos on the network. His Nebula channel are later videos (mostly documentaries) he made since mid 2019. In 2024, he collaborated with Nebula to make the Nebula Original film (movie) 17 Pages, said to be released in early 2025.'
- id: fandom_265321
  url: https://youtube.fandom.com/wiki/CaliforniaSOS
  text: CaliforniaSOS - CaliforniaSOS is an American YouTube channel that discusses various election matters relating to Californian voters which are animated and educational. The channel is linked on the official California government website relating to voting, and the videos are sometimes a few hours long or very short. Most of the longer videos are meetings which are held by government officials, but the shorter videos are targeted to the Californian voter. There are no closed captions on the videos, and a few videos are in Spanish. The about page is blank with just the country name, and the channel page links to a channel by Washington state and Colorado state governments along with another channel by California government.
- id: fandom_497065
  url: https://youtube.fandom.com/wiki/Liz_Productions5784
  text: 'Liz Productions5784 - Elizabeth "Liz" Teofilo (born: August 1, 1995 (1995-08-01) [age 30]), better known online as Liz Productions5784 is an American YouTuber based around Singing, Redubs, Art, Cooking, and Reactions. She joined YouTube on September 10, 2012, but started uploading videos on January 15, 2015. Some of Liz''s first videos were reads of The Railway Series and skits using Thomas Wooden Railway merchandise. Besides one, they never really got popular. In May 2015 though, on a site called DeviantArt, she asked someone to make a Thomas & Friends sprite of an original character, or "trainsona", that she had in mind. The result was a blue saddle tank engine with the nameplate "Liz" on both sides. Liz would use this sprite to represent herself for years to come. WIP She lives in Wisconsin, United States. Liz has started a Patreon.'
- id: fandom_546771
  url: https://youtube.fandom.com/wiki/InfraredFox
  text: 'InfraredFox - Rhys (born: March 16, 2006 (2006-03-16) [age 19]), better known online as InfraredFox, is an English YouTuber who plays a bunch of games such as Minecraft, Roblox, Fortnite, Lethal Company and other games. InfraredFox created his first channel in 2017 named Emerald Diamond Master. where he made SML type videos where he played with his toys making weird scenarios and he had a series called Sharkys Funny Moments which was a blue Shark Puppet and other characters like Kevin and Oliva where characters. The Channel later got deleted with no known reason In 2018 a new channel was created called The Green A which was a channel with only 2 subscribers and never any videos In 2020 InfraredFox created his first channel that is still up named BlahMountain629 where he posted some games and his Object Show named THIS (The Humongous Internet Show) where 21 contestants battle for a prize with the hosts Golden Egg and TV. The Channel later got left by an one year full Internet hiatus
    and the last video was THIS Intro 7+. In 2022 InfraredFox created three new channels, InfraredFox, InfraredAnimates and InfraredClips where InfraredClips was abandoned and InfraredAnimates was renamed to Rhys Entertainment. InfraredFox has 3 main Channels, 1 minor channel, 5 inactive Channels and 2 Deleted Channels. InfraredFox''s main channel is InfraredFox where he uploads more of his main videos. InfraredFox has the most videos with over 670 and was created 29th June 2022 and the first upload was If a Pufferish had a Jumpscare where the Fugu fish from the cartoon, Fugu, slowly goes closer to the screen. InfraredFox started uploading daily at the start of 2023. He mostly plays with Papi, Ace, Leo, Chloe, Madleen, EarthBoundGames, Jaz, Jackie, Mori, Mirror, Angel and Cylia with a few people who aren''t as active being Dylan, Jaylo and Endgamee. Rhys Entertainment is an animation YouTube Channel that mostly has animations on the series, Rift Effect, which is an Object Show with 64 Contestants
    and 1 Host '
- id: fandom_550599
  url: https://youtube.fandom.com/wiki/Mkdasher
  text: 'Mkdasher - David Roldan Santos, better known online as mkdasher or MKDasher is a Spanish speedrunner, TASer, and Mario Kart DS world champion known for being the former and current holder of many world records of the Nintendo DS game. He is #4 in the world for total Mario Kart DS world records, and #2 for current Mario Kart DS world records. The channel was created on May 18, 2008, and the first video was posted on June 7, 2008. Santos posts his runs of Mario Kart DS and Wii tracks, beta tracks, and custom tracks with some of the runs being current or former world records. Additionally, he may show glitches and shortcuts that have been discovered by him or other players. Santos has shown glitches, and TAS speedruns in Super Mario 64 and Super Mario 64 DS. His and ALAKTORN''s TAS speedruns on the latter became the most viewed videos of the channel. Santos has done speedruns from games of the Pokémon series. He has also shown glitches in those games as well. Santos has played songs
    from the games he plays on his piano. Also, he has used FL Studio to make videogame-based music. Santos has played other games such as a former world record of 2048, Mario & Sonic at the Olympic Games, Mario Party 3, Bike Race, Agar.io, and Diep.io. He has also made two video intros.'
- id: fandom_451057
  url: https://youtube.fandom.com/wiki/Lyle_Forever
  text: 'Lyle Forever - Lyle Drescher (born: December 20, 1997 (1997-12-20) [age 27]), better known online as Lyle Forever, is an American comedian, performance artist, Twitch streamer, and YouTuber who is best known for his Therapy Gecko streams. Lyle created his channel in October 5, 2011. He uploaded his first video, a comedy skit titled "Doritos", in February 18, 2012. Up until 2020 he would upload variety comedy and commentary with his friends. In March 22, 2020, he uploaded his first video in his iconic gecko costume. It was a comedic short titled "HELP HELP HELP HELP HELP HELP", it was about him evading a man named Curtis who ''liked to have sex with his birds and lizards''. He would start his Therapy Gecko streams a month later, and highlights of those streams is now what he mainly uploads. His Therapy Gecko series is about him receiving calls from his viewers, where they would have an impromptu therapy session. Viewers can either be serious in their calls or just tell a joke story,
    either way Lyle will respond as seriously as possible. Therapy Gecko is his most popular series of streams and videos. Many rappers such as Lil Yachty and Zack Fox had been guest geckos in his streams. He also had Dr. Drew Pinsky, a real medical specialist, as a guest gecko.'
- id: fandom_177211
  url: https://youtube.fandom.com/wiki/DigbyTheGoat
  text: 'DigbyTheGoat - Digby Hircus, better known as DigbyTheGoat (born: April 8, 1998 (1998-04-08) [age 27]), formerly Quadroblitz, is an American YouTuber artist and commentator. DigbyTheGoat first created his account on May 13, 2010, under the name Quadroblitz. On May 14, 2017, DigbyTheGoat uploaded "Reading Re-Nightmare - | Part 1 | - Phantom Kinq". This was a dramatic reading of the Re-Nightmare comic. On May 17, 2017, Digby uploaded "Emotional Loud House Fanfiction". However, in his DeviantArt journal section, there are journals for videos from 2016 and before. It includes some MAP parts, and collaborations he did with other people. However, the links to the MAP parts lead to videos that were taken down. There are some other links that lead to videos from 2014-2015 that are unlisted on his channel. The oldest one that appears is an unlisted video called "Angry Captain America Fangirl- Dramatic Reading". This video was uploaded on August 11, 2014 and was uploaded to a different channel.
    The channel is called Quadro blitz. The second oldest video is called "(Scrapped Footage) Fatal Error Episode 1: Scene 1". This video is a deleted scene from the cartoon Digby made that was based off his comic, called "Fatal Error". The third unlisted video was uploaded on January 6, 2015, and is titled "Fatal Error Theme Song + Intro". At some point before 2013, Digby made a comic called Fatal Error. The comic is now long deleted, but it''s mentioned in the first Re-Nightmare video on the channel. There are pictures shown in the video of Fatal Error when it was originally started, drawn on notebook paper. But Fatal Error wasn''t really noticed until the series. The pilot episode was uploaded on October 22, 2015 as "Fatal Error (series pilot, practice project)". The pilot is about five friends, Mittens, Toasterhead, Liam, Alphonse, and Rosa, trying to defeat a giant robot. The video is now unlisted, like everything that came out before the first Re-Nightmare video, but the link is pretty
    easy to find. D'
- id: fandom_239029
  url: https://youtube.fandom.com/wiki/Ane
  text: Ane - Elijah Sturdevant, better known online as Ane, formerly Anevyan (and prior to that NCSNL), is an American YouTuber that uploads commentary videos. He formerly uploaded motion design videos and videos of him making songs from NoCopyrightSounds use the audio spectrum of Monstercat. He is a graphic and motion designer. His channel was about GFX, VFX, 2.5D Animation, and everything else within his knowledge, but ever since his return in June 2022, he moved on to commentary. His original project, NCSNL (NoCopyrightSounds new layout), was to upload all the NCS songs with the Monstercat visualizer, but he ended the project in 2020 due to his new interests. He has a 2nd channel which was simply named Elijah. Anevyan launched his channel on April 4, 2015, and uploaded his first video, on April 5, 2015, titled "[House] Spektrem - Shine [NCS Release]". The video is about the same song available on NoCopyrightSounds, except that it has Monstercat's audio visuals. His project was pretty
    active at first. He gained lots of views and subscribers because he uploaded NCS songs. But in 2018, he became less and less active on the project. It was due to him getting kicked out of the house by his mom. He lives at his grandparents' house which has slow WiFi and that affected his upload schedule. Eventually, he decided to start uploading his own animation videos and handed the project over to his friend, Foxster. The project officially came to a close in 2020. Later on, Elijah shared the NCSNL (Monstercat) visualizer template to everybody.
- id: fandom_501194
  url: https://youtube.fandom.com/wiki/Brian_Wilson
  text: Brian Wilson - Brian Douglas Wilson † (June 20, 1942 - June 11, 2025 [aged 82]) was an American musician, singer, songwriter, and record producer who co-founded the Beach Boys. Brian, who grew up influenced by 1950s rock and roll and jazz-based vocal groups, originally functioned as the band's songwriter, producer, co-lead vocalist, bassist, keyboardist, and de facto leader. In 1964, he suffered a nervous breakdown and stopped touring with the group, which led to more personal work such as Pet Sounds (1966) and the unfinished Smile. He retreated from his dominance of the Beach Boys after 1967, yielding most of the control to his younger brother Carl. He made sporadic contributions to their records, returning only briefly in the 1970s and 2010s, the latter as part of a special 50th anniversary tour and album. Brian started his solo career in 1988, and went on to tour regularly as a solo artist from 1999 to 2022. In 2024, it was revealed that Wilson was suffering from dementia. Following
    this, he was placed in a conservatorship, with Jean Sievers, and LeeAnn Hard, as his conservators. His death at the age of 82 was announced on June 11, 2025. His family declined to state a cause of death. His YouTube channel was created on October 1, 2009.
- id: fandom_527018
  url: https://youtube.fandom.com/wiki/Frank_Hannon
  text: 'Frank Hannon - Frank Hannon (born: October 3, 1966 (1966-10-03) [age 59]) is an American[citation needed] guitarist best known for his work with the band TESLA, the band is best known for the cover song of Signs, Moden Day Cowboy and Love Song. Frank Hannon broke his leg in 1976 at the age of 10, when he got in a dirt bike accident, Hannon would spend his summer practicing guitar and listening to records. His grandfather also had a piano and his mother taught him how to play it. Tesla was founded in 1981. Hannon has appeared on all of Tesla''s albums.[citation needed] In 2005 Hannon would release his first solo debut album titled ''''Gutairz from Marz''''. Hannon would release his second album Gypsy Highway in 2010, Hannon would release many more solo albums including self titled Frank Hannon, World Peace, From One Place to another vol 1 and 2. Besides albums he would also record and release some singles. Hannon joined YouTube on November 29 2009. Frank Hannon also has a podcast
    on his channel called The Far Out Podcast, which started in 2019.'
