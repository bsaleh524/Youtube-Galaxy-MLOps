[project]
name = "youtube-galaxy-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

# Mirrors each component's requirements.txt (still the source of truth for
# Docker builds — those images install via pip, not uv). Install a single
# group with `uv sync --only-group <name>`, or everything with `uv sync --all-groups`.
[dependency-groups]
learn = [
    "apache-airflow>=2.9.0",
    "mlflow>=2.12.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "weaviate-client>=4.9,<5",
    "sentence-transformers>=3.0",
    "duckdb>=0.10.0",
    "jupyter>=1.0.0",
]
training = [
    "torch>=2.0.0",
    "sentence-transformers>=2.7.0",
    "einops>=0.7.0",
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.6",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "mlflow>=2.12.0",
    "boto3>=1.34.0",
    "numpy>=1.26.0",
]
quick = [
    "weaviate-client>=4.9,<5",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]
stats-api = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
]
chatbot-api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "weaviate-client>=4.5.0",
    "groq>=0.5.0",
    "boto3>=1.34.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.6.0",
]
embedding-service = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sentence-transformers>=2.7.0",
    "einops>=0.7.0",
    "torch>=2.0.0",
    "redis>=5.0.0",
    "pydantic>=2.6.0",
]
